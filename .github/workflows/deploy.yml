name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - 'functions/telegram-bot/**'
      - 'migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      SB_SERVICE_ROLE_KEY: ${{ secrets.SB_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -e
          ERRORS=0

          check_set() {
            if [ -z "$2" ]; then
              echo "::error::$1 is not set"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ $1 is set"
            fi
          }

          check_format() {
            local name="$1" value="$2" pattern="$3" hint="$4"
            if [ -z "$value" ]; then
              echo "::error::$name is not set"
              ERRORS=$((ERRORS + 1))
            elif ! echo "$value" | grep -qE "$pattern"; then
              echo "::error::$name has unexpected format (expected: $hint)"
              ERRORS=$((ERRORS + 1))
            else
              echo "  ✓ $name format OK"
            fi
          }

          echo "--- Checking secrets ---"
          check_format "SUPABASE_ACCESS_TOKEN"  "$SUPABASE_ACCESS_TOKEN"  "^sbp_[A-Za-z0-9]+"         "sbp_..."
          check_format "SUPABASE_PROJECT_REF"   "$SUPABASE_PROJECT_REF"   "^[a-z0-9]{20}$"             "20 lowercase alphanumeric chars"
          check_format "SB_SERVICE_ROLE_KEY"    "$SB_SERVICE_ROLE_KEY"    "^eyJ"                       "eyJ... (JWT)"
          check_format "TELEGRAM_BOT_TOKEN"     "$TELEGRAM_BOT_TOKEN"     "^[0-9]+:[A-Za-z0-9_-]{35,}" "<id>:<35+ chars>"
          check_set    "SUPABASE_URL"            "$SUPABASE_URL"
          check_set    "TELEGRAM_WEBHOOK_SECRET" "$TELEGRAM_WEBHOOK_SECRET"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS secret(s) failed validation — aborting deploy."
            exit 1
          fi
          echo "All secrets OK."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy function
        run: supabase functions deploy telegram-bot --no-verify-jwt

      - name: Push DB migrations
        run: supabase db push

      - name: Smoke test
        run: |
          set -e
          echo "POST $SUPABASE_URL/functions/v1/telegram-bot"
          HTTP_STATUS=$(curl -s -o /tmp/smoke.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/telegram-bot" \
            -H "Content-Type: application/json" \
            -H "x-telegram-bot-api-secret-token: $TELEGRAM_WEBHOOK_SECRET" \
            -d '{"update_id":0,"message":{"chat":{"id":0},"text":"/ping"}}')
          echo "HTTP $HTTP_STATUS — $(cat /tmp/smoke.json)"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Smoke test failed: HTTP $HTTP_STATUS"
            exit 1
          fi