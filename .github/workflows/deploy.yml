name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - 'functions/telegram-bot/**'
      - 'migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy function
        run: supabase functions deploy telegram-bot --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Optional smoke test (if SUPABASE_URL & TELEGRAM_WEBHOOK_SECRET set)
        if: ${{ env.SUPABASE_URL != '' && env.TELEGRAM_WEBHOOK_SECRET != '' }}
        run: |
          set -e
          echo "Running smoke test against ${{ env.SUPABASE_URL }}/functions/v1/telegram-bot"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ env.SUPABASE_URL }}/functions/v1/telegram-bot" \
            -H "Content-Type: application/json" \
            -H "x-telegram-bot-api-secret-token: ${{ env.TELEGRAM_WEBHOOK_SECRET }}" \
            -d '{"update_id":0,"message":{"chat":{"id":0},"text":"/ping"}}')
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Smoke test failed: HTTP $HTTP_STATUS"
            exit 1
          fi